<div id="category-tabs" class="flex flex-wrap gap-2">
    {% for category in categories %}
    <button
        hx-get="/news/{{ category.value }}"
        hx-target="#news-list"
        hx-swap="innerHTML"
        hx-indicator="#loading-{{ category.value }}"
        class="px-4 py-2 rounded-lg font-medium transition-all
               {% if category == active_category %}
               bg-blue-600 text-white shadow-md
               {% else %}
               bg-white text-gray-700 hover:bg-gray-50 border border-gray-200
               {% endif %}"
        onclick="document.querySelectorAll('#category-tabs button').forEach(b => {
            b.classList.remove('bg-blue-600', 'text-white', 'shadow-md');
            b.classList.add('bg-white', 'text-gray-700', 'border', 'border-gray-200');
        });
        this.classList.remove('bg-white', 'text-gray-700', 'border', 'border-gray-200');
        this.classList.add('bg-blue-600', 'text-white', 'shadow-md');"
    >
        <span id="loading-{{ category.value }}" class="htmx-indicator mr-1">
            <svg class="w-4 h-4 spinner inline" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </span>
        {{ category.display_name }}
    </button>
    {% endfor %}

    {% if fetch_success %}
    <span class="px-4 py-2 text-green-600 font-medium animate-pulse">
        ✅ 取得完了
    </span>
    {% endif %}
</div>
