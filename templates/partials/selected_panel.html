{#
  選んだ記事と、そこから動画を作る操作。

  **記事プールと同じカードの中に置く。** 以前は別のカードで、記事一覧
  （8,633px）の下にあったため、選ぶ場所と生成ボタンが同時に見えなかった。
  1件選ぶたびに 8,600px 往復することになる。

  **件数と見出しもここが描く。** 以前は呼び出し側（index.html）が持つ
  バッジを、このフラグメントに混ぜた `<script>` が innerHTML で書き換えて
  いた。フラグメントに script を混ぜると、このパネルを差し替える経路以外
  ではバッジが更新されず、更新の仕組みがテンプレートの中に隠れる。
  パネルと同じ場所で描けば、パネルが差し替わるたびに必ず一致する。
#}
<div class="flex items-center justify-between mb-2">
    <div class="flex items-center gap-2">
        <h3 class="font-display font-semibold text-ink text-xs tracking-wide">選択した記事</h3>
        <span class="bg-teal text-paper px-2 py-0.5 rounded-full text-xs font-semibold tnum">
            {{ selected_count }}件
        </span>
    </div>
    {% if selected_articles %}
    {#
      一括解除。1件ずつ解除するしかないと、選び直すたびに選択の数だけ
      操作が要る。表示中のカテゴリを一緒に送るのは、応答が一覧を作り直す
      ため（何枚が「選択中」の見た目で残っているかはサーバーから分からない）。
    #}
    <button
        hx-post="/selected/clear"
        hx-include="#category-tabs [name=category]"
        hx-target="#news-list"
        hx-swap="innerHTML"
        class="text-xs text-ink/50 hover:text-vermilion transition-colors
               focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal"
    >
        すべて解除
    </button>
    {% endif %}
</div>

{% if selected_articles %}
{#
  選んだものは一覧で確認できる（カードが「選択中」になる）ので、ここは
  「これから作るもの」の読み合わせに絞る。生成は課金とクォータを使う
  取り消せない操作なので、押す直前に対象が見えている必要がある。

  高さは max-h で抑える。ここが伸びると、その分だけ記事一覧が縮む。
#}
<div class="space-y-1 mb-3 max-h-28 overflow-y-auto">
    {% for article in selected_articles %}
    <div class="flex items-center gap-2 text-xs">
        <span class="flex-1 min-w-0 truncate text-ink/80">{{ article.title }}</span>
        <button
            hx-delete="/news/{{ article.id }}/remove"
            hx-target="#selected-panel"
            hx-swap="innerHTML"
            class="shrink-0 text-ink/40 hover:text-vermilion transition-colors
                   focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal"
            aria-label="{{ article.title }} の選択を解除"
        >
            解除
        </button>
    </div>
    {% endfor %}
</div>

{#
  動画形式。絵文字は使わない（この画面の規律）。尺と向きが選ぶ根拠なので、
  それを書く。既定はショート——定期実行の既定が short で、長尺は当面
  作らない方針（CLAUDE.md「長尺は当面作らない」）。
#}
<div class="grid grid-cols-3 gap-2 mb-3" role="radiogroup" aria-label="動画形式">
    {% for option in [
        {"value": "short", "label": "ショート", "detail": "約35秒 ・ 縦"},
        {"value": "tiktok", "label": "TikTok", "detail": "60〜90秒 ・ 縦"},
        {"value": "long", "label": "ロング", "detail": "約5分 ・ 横"},
    ] %}
    <label class="cursor-pointer">
        <input type="radio" name="video_format" value="{{ option.value }}"
               {% if option.value == "short" %}checked{% endif %}
               class="peer sr-only" form="generate-form">
        <span class="block rounded border border-ink/15 px-2 py-1.5 text-center
                     peer-checked:border-teal peer-checked:bg-teal/10
                     peer-focus-visible:outline peer-focus-visible:outline-2
                     peer-focus-visible:outline-teal
                     hover:border-ink/30 transition-colors">
            <span class="block text-xs font-medium text-ink">{{ option.label }}</span>
            <span class="block text-[10px] text-ink/50 tnum">{{ option.detail }}</span>
        </span>
    </label>
    {% endfor %}
</div>

<form id="generate-form"
      hx-post="/generate"
      hx-target="#generation-status"
      hx-swap="innerHTML"
      hx-indicator="#generate-indicator">
    <button type="submit"
        class="w-full bg-teal text-paper px-4 py-2.5 rounded font-medium text-sm
               hover:bg-teal/90 transition-colors flex items-center justify-center gap-2
               focus-visible:outline focus-visible:outline-2 focus-visible:outline-ink"
    >
        <span id="generate-indicator" class="htmx-indicator">
            <svg class="w-4 h-4 spinner" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </span>
        <span class="tnum">{{ selected_count }}件の動画を生成</span>
    </button>
</form>

{% else %}
<p class="text-xs text-ink/40 mb-3">
    記事を選ぶと、ここに作るものが並びます。
</p>
<button disabled
        class="w-full bg-ink/10 text-ink/40 px-4 py-2.5 rounded font-medium text-sm cursor-not-allowed">
    動画を生成
</button>
{% endif %}

<div id="generation-status" class="mt-3"></div>
