<!-- YouTubeアップロード結果 -->
{% if success %}
<div class="rounded-lg border border-teal/30 bg-teal/10 p-4">
    <div class="flex items-start gap-3">
        <div class="flex-1">
            <p class="font-semibold text-teal">アップロード完了</p>
            <p class="text-sm text-ink/70 mt-1">{{ title }}</p>
            <a href="{{ video_url }}"
               target="_blank"
               class="inline-flex items-center gap-2 mt-3 text-ink hover:underline font-medium text-sm
                      focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
                YouTubeで見る
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
            </a>
        </div>
    </div>
</div>
{% else %}
<div class="rounded-lg border border-vermilion/30 bg-vermilion/10 p-4">
    <div class="flex items-start gap-3">
        <div class="flex-1">
            <p class="font-semibold text-vermilion">アップロード失敗</p>
            <p class="text-sm text-ink/70 mt-1">{{ error_message }}</p>
            {% if need_auth %}
            <button
                hx-post="/youtube/auth"
                hx-target="#youtube-status"
                hx-swap="innerHTML"
                class="mt-3 px-4 py-2 rounded border border-ink/20 text-sm font-medium
                       hover:bg-ink/5 transition-colors inline-flex items-center gap-2
                       focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal"
            >
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
                YouTubeにログイン
            </button>
            {% endif %}
        </div>
    </div>
</div>
{% endif %}
