<!-- TikTok認証状態 -->
{% if not is_configured %}
<div class="flex items-center gap-2 text-ink/40">
    <span class="text-sm">TikTok未設定</span>
</div>
<p class="text-xs text-ink/40 mt-1">APIキーを.envに設定してください</p>
{% elif is_authenticated %}
<div class="flex items-center gap-2 text-teal">
    <span class="text-sm font-medium">TikTok連携済み</span>
</div>
{% if auth_message %}
<p class="text-xs text-teal mt-1">{{ auth_message }}</p>
{% endif %}
{% else %}
<div class="flex items-center gap-2">
    <span class="text-sm text-ink/50">TikTok未連携</span>
</div>
{% if auth_message %}
<p class="text-xs text-vermilion mt-1">{{ auth_message }}</p>
{% endif %}
<button
    hx-post="/tiktok/auth"
    hx-target="#tiktok-status"
    hx-swap="innerHTML"
    hx-indicator="#tiktok-auth-indicator"
    class="mt-2 px-4 py-2 rounded border border-ink/20 text-sm font-medium
           hover:bg-ink/5 transition-colors flex items-center gap-2
           focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal"
>
    <span id="tiktok-auth-indicator" class="htmx-indicator">
        <svg class="w-4 h-4 spinner" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
    </span>
    <!-- TikTok logo SVG -->
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
    </svg>
    TikTokにログイン
</button>
{% endif %}
