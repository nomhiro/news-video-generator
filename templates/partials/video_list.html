<!-- 生成済み動画一覧 -->
{% if videos %}
<div class="space-y-3">
    {% for video in videos %}
    <div class="bg-gray-50 rounded-lg p-4 border border-gray-200">
        <div class="flex items-start justify-between gap-4">
            <div class="flex-1 min-w-0">
                <h4 class="font-medium text-gray-800 truncate" title="{{ video.filename }}">
                    {{ video.filename }}
                </h4>
                <div class="flex items-center gap-3 mt-1 text-sm text-gray-500">
                    <span class="inline-flex items-center gap-1">
                        {% if video.language == "ja" %}
                        🇯🇵 日本語
                        {% elif video.language == "en" %}
                        🇺🇸 英語
                        {% else %}
                        📹 {{ video.language }}
                        {% endif %}
                    </span>
                    <span>{{ video.size_mb }} MB</span>
                </div>
            </div>
            <div class="flex gap-2">
                <!-- YouTube Upload Button -->
                <button
                    type="button"
                    class="bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium
                           hover:bg-red-700 transition-colors flex items-center gap-1 whitespace-nowrap upload-btn"
                    data-key="{{ video.key }}"
                    data-title="{{ video.title | default(video.filename, true) }}"
                    data-description="{{ video.description }}"
                    title="YouTubeにアップロード"
                >
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                    YouTube
                </button>
                <!-- TikTok Upload Button -->
                <button
                    type="button"
                    class="bg-black text-white px-3 py-1.5 rounded-lg text-sm font-medium
                           hover:bg-gray-800 transition-colors flex items-center gap-1 whitespace-nowrap tiktok-upload-btn"
                    data-key="{{ video.key }}"
                    data-title="{{ video.title | default(video.filename, true) }}"
                    title="TikTokにアップロード"
                >
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                    </svg>
                    TikTok
                </button>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="text-center py-8 text-gray-400">
    <p class="text-4xl mb-2">📹</p>
    <p>まだ動画がありません</p>
    <p class="text-sm mt-1">ニュースを選択して動画を生成してください</p>
</div>
{% endif %}
