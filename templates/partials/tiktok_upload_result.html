<!-- TikTokアップロード結果 -->
{% if success %}
<div class="rounded-lg border border-teal/30 bg-teal/10 p-4">
    <div class="flex items-start gap-3">
        <div class="flex-1">
            <p class="font-semibold text-teal">アップロード完了</p>
            <p class="text-sm text-ink/70 mt-1">{{ title }}</p>
            <p class="text-xs text-ink/50 mt-2">TikTokアプリまたはWebサイトで動画を確認してください</p>
            <a href="{{ video_url }}"
               target="_blank"
               class="inline-flex items-center gap-2 mt-3 text-ink hover:underline font-medium text-sm
                      focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                </svg>
                TikTokを開く
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
            </a>
        </div>
    </div>
</div>
{% else %}
<div class="rounded-lg border border-vermilion/30 bg-vermilion/10 p-4">
    <div class="flex items-start gap-3">
        <div class="flex-1">
            <p class="font-semibold text-vermilion">アップロード失敗</p>
            <p class="text-sm text-ink/70 mt-1">{{ error_message }}</p>
            {% if need_auth %}
            <button
                hx-post="/tiktok/auth"
                hx-target="#tiktok-status"
                hx-swap="innerHTML"
                class="mt-3 px-4 py-2 rounded border border-ink/20 text-sm font-medium
                       hover:bg-ink/5 transition-colors inline-flex items-center gap-2
                       focus-visible:outline focus-visible:outline-2 focus-visible:outline-teal"
            >
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                </svg>
                TikTokにログイン
            </button>
            {% endif %}
        </div>
    </div>
</div>
{% endif %}
