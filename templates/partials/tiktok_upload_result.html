<!-- TikTokアップロード結果 -->
{% if success %}
<div class="bg-green-50 border border-green-200 rounded-lg p-4">
    <div class="flex items-start gap-3">
        <span class="text-2xl">✅</span>
        <div class="flex-1">
            <p class="font-semibold text-green-800">アップロード完了!</p>
            <p class="text-sm text-green-600 mt-1">{{ title }}</p>
            <p class="text-xs text-gray-500 mt-2">TikTokアプリまたはWebサイトで動画を確認してください</p>
            <a href="{{ video_url }}"
               target="_blank"
               class="inline-flex items-center gap-2 mt-3 text-black hover:text-gray-700 font-medium text-sm">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                </svg>
                TikTokを開く
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
            </a>
        </div>
    </div>
</div>
{% else %}
<div class="bg-red-50 border border-red-200 rounded-lg p-4">
    <div class="flex items-start gap-3">
        <span class="text-2xl">❌</span>
        <div class="flex-1">
            <p class="font-semibold text-red-800">アップロード失敗</p>
            <p class="text-sm text-red-600 mt-1">{{ error_message }}</p>
            {% if need_auth %}
            <button
                hx-post="/tiktok/auth"
                hx-target="#tiktok-status"
                hx-swap="innerHTML"
                class="mt-3 bg-black text-white px-4 py-2 rounded-lg text-sm font-medium
                       hover:bg-gray-800 transition-colors inline-flex items-center gap-2"
            >
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
                </svg>
                TikTokにログイン
            </button>
            {% endif %}
        </div>
    </div>
</div>
{% endif %}
